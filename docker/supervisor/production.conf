[supervisord]
# nodaemon=true
# stdout_logfile=/dev/stderr
# stderr_logfile_maxbytes=0
nodaemon=true
# user directive removed since we're already running as non-root
logfile=/var/www/html/storage/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:laravel-queue]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
# Removed user directive to run as the same user as supervisord
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/laravel-queue.log
stopwaitsecs=3600

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=5
# Use the same user as supervisord
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
# Use the same user as supervisord
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0